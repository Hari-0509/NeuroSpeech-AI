services:

  backend:

    build:
      context: ./backend

    container_name:
      neurospeech-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ./samples:/samples

  frontend:

    build:
      context: ./frontend

    container_name:
      neurospeech-frontend

    ports:
      - "3000:3000"

    environment:
      - REACT_APP_API_URL=http://localhost:8000

    depends_on:
      - backend
